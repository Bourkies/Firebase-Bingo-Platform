<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo GIF Generator</title>
    <script type="importmap">
    {
        "imports": {
            "nanostores": "https://esm.sh/nanostores",
            "lit": "https://esm.sh/lit",
            "lit/": "https://esm.sh/lit/",
            "lit-html/": "https://esm.sh/lit-html/",
            "webm-muxer": "https://esm.sh/webm-muxer",
            "html-to-image": "https://esm.sh/html-to-image"
        }
    }
    </script>
    <script src="/js/theme-loader.js"></script>
    <link rel="stylesheet" href="/css/theme.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    <style>
        body {
            background-color: var(--bg-color);
            color: var(--primary-text);
            font-family: var(--font-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .controls-container {
            width: 95%;
            max-width: 1400px;
            background-color: var(--surface-color);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            border: 1px solid var(--border-color);
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            align-items: flex-end;
        }
        label { font-weight: bold; font-size: 0.9rem; color: var(--secondary-text); }
        select, input, button {
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--primary-text);
        }
        button {
            background-color: var(--accent-color);
            color: var(--accent-text-color);
            cursor: pointer;
            font-weight: bold;
            border: none;
        }
        button:disabled { background-color: #555; cursor: not-allowed; }
        button.secondary { background-color: transparent; border: 1px solid var(--accent-color); color: var(--accent-color); }
        
        #preview-container {
            width: 95%;
            max-width: 1400px;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
            /* Checkerboard pattern for transparency */
            background-color: #222;
            background-image: linear-gradient(45deg, #333 25%, transparent 25%), linear-gradient(-45deg, #333 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #333 75%), linear-gradient(-45deg, transparent 75%, #333 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
        }

        /* The element we actually capture */
        #capture-target {
            position: relative;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transform-origin: center center;
            flex-shrink: 0;
            /* We will scale this via JS for resolution control */
        }

        #progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #333;
            border-radius: 5px;
            margin-top: 0.5rem;
            overflow: hidden;
            display: none;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: var(--accent-color);
            transition: width 0.1s linear;
        }
        
        .overlay-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 100;
            pointer-events: none;
        }
        .overlay-info div { line-height: 1.2; }

        /* Board Styles (Ported from index.html) */
        .tile-overlay {
            position: absolute; 
            box-sizing: border-box;
            border-width: var(--tile-border-width, 2px);
            border-color: var(--tile-border-color, transparent);
            transition: background-color 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
            display: flex; align-items: center; justify-content: center; text-align: center; color: var(--primary-text);
            font-weight: bold; text-shadow: 1px 1px 3px var(--text-shadow-color);
            font-size: 0.9rem; padding: 4px; cursor: pointer;
        }
        .stamp-image {
            position: absolute; width: 100%; height: 100%; background-size: contain;
            background-repeat: no-repeat; pointer-events: none; background-position: center;
        }
        
        #access-denied { text-align: center; padding: 3rem; background-color: var(--surface-color); border-radius: 12px; max-width: 600px; margin: 4rem auto; display: none; }
        #main-content { width: 100%; display: flex; flex-direction: column; align-items: center; display: none; }
    </style>
</head>
<body>
    <app-navbar></app-navbar>

    <div id="access-denied">
        <h1>Access Denied</h1>
        <p>You must be an Admin to view this page. Please log in with an authorized account.</p>
    </div>

    <div id="main-content">
    <div class="controls-container">
        <div class="control-row">
            <div class="control-group" style="flex: 1; min-width: 200px;">
                <label>Team</label>
                <select id="team-selector" style="width: 100%;"><option>Loading...</option></select>
            </div>
            <div class="control-group" style="flex: 2; min-width: 300px;">
                <label>Date Range</label>
                <div style="display: flex; gap: 0.5rem;">
                    <input type="datetime-local" id="start-date" style="flex: 1;">
                    <input type="datetime-local" id="end-date" style="flex: 1;">
                </div>
            </div>
        </div>
        
        <div class="control-row">
            <div class="control-group">
                <label>Output Resolution (Width px)</label>
                <input type="number" id="gif-width" value="800" min="100" step="10" style="width: 120px;">
            </div>
            <div class="control-group">
                <label>Format</label>
                <select id="export-format">
                    <option value="gif">GIF (Image)</option>
                    <option value="webm">WebM (Video)</option>
                </select>
            </div>
            <div class="control-group">
                <label>Render Mode</label>
                <select id="render-mode">
                    <option value="events">Event Sequence (Linear)</option>
                    <option value="timelapse">Time Lapse (Real-time)</option>
                </select>
            </div>
            <div class="control-group" id="timing-control-group">
                <!-- Label will be updated by JS -->
                <label id="timing-label">Duration (Seconds)</label>
                <input type="number" id="total-duration" value="10" min="1" max="60" style="width: 100px;">
            </div>
            <div class="control-group">
                <label>End Hold (Seconds)</label>
                <input type="number" id="end-delay" value="3" min="0" max="10" step="0.5" style="width: 100px;">
            </div>
            
            <div class="control-group">
                <label>Overlay Position</label>
                <select id="overlay-position">
                    <option value="bottom-left">Bottom Left</option>
                    <option value="bottom-center">Bottom Center</option>
                    <option value="bottom-right">Bottom Right</option>
                    <option value="top-left">Top Left</option>
                    <option value="top-center">Top Center</option>
                    <option value="top-right">Top Right</option>
                </select>
            </div>
            <div class="control-group">
                <label>Overlay Size</label>
                <input type="range" id="overlay-size" min="0.5" max="3.0" step="0.1" value="1.5">
            </div>

            <div class="control-group">
                <label>Background</label>
                <div style="display: flex; align-items: center; gap: 0.5rem; height: 38px;">
                    <input type="color" id="bg-color-picker" value="#ffffff" style="height: 100%; padding: 2px; width: 50px;">
                    <label style="font-weight: normal; margin: 0; cursor: pointer;"><input type="checkbox" id="bg-transparent" checked> Transparent</label>
                </div>
            </div>
            <div class="control-group">
                <label>Options</label>
                <label style="font-weight: normal; height: 38px; display: flex; align-items: center;"><input type="checkbox" id="simple-mode" checked> Simple Mode (Complete/Verified Only)</label>
                <label style="font-weight: normal; height: 38px; display: flex; align-items: center;"><input type="checkbox" id="loop-anim" checked> Loop Animation (GIF)</label>
                <label style="font-weight: normal; height: 38px; display: flex; align-items: center;"><input type="checkbox" id="show-overlay" checked> Show Info Overlay</label>
            </div>
        </div>

        <div class="control-row" style="justify-content: space-between; align-items: center; margin-top: 0.5rem;">
            <div id="size-estimate" style="font-size: 0.9rem; color: var(--secondary-text);">Est. Size: Calculating...</div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <div id="status-text" style="font-size: 0.9rem; margin-right: 1rem;">Ready</div>
                <button id="preview-btn" class="secondary">Preview Animation</button>
                <button id="thumbnail-btn" class="secondary">Download Thumbnail</button>
                <button id="record-btn">Record & Download</button>
                <button id="batch-btn" class="secondary" style="border-color: #ff9800; color: #ff9800;">Batch Export All</button>
            </div>
        </div>
        <div id="progress-bar-container"><div id="progress-bar"></div></div>
    </div>

    <div id="preview-container">
        <div id="capture-target">
            <!-- Board Tiles will be injected here -->
            <div class="overlay-info">
                <div id="overlay-team">Team Name</div>
                <div id="overlay-date">YYYY-MM-DD</div>
            </div>
        </div>
    </div>
    </div>

    <script type="module" src="/js/pages/gifGeneratorController.js"></script>
</body>
</html>
